site_name: GitDatabase
site_description: Documentação oficial do GitDatabase
site_url: https://devcomputaria.github.io/gitdatabase/
repo_url: https://github.com/DevComputaria/gitdatabase
repo_name: DevComputaria/gitdatabase
copyright: Made DevComputaria with MkDocs

extra:
  generator: false

docs_dir: docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Arquitetura:
      - Visão geral: architecture.md
      - Contexto e componentes: architecture/system-context.md
      - Pipelines e consistência: architecture/data-pipelines.md
      - Atributos de qualidade: architecture/quality-attributes.md
  - Banco de dados: database.md
  - Pilot: pilot.md
  - Runbook: runbook.md
  - Roadmap: roadmap.md
